name: SpyAware CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ble:
    name: Build SpyAware BLE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t spyaware-android-build -f SpyAware-BLE/Dockerfile SpyAware-BLE

      - name: Run Android tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/SpyAware-BLE:/workspace" \
            -w /workspace \
            spyaware-android-build \
            ./gradlew test --no-daemon

      - name: Build Debug APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/SpyAware-BLE:/workspace" \
            -w /workspace \
            spyaware-android-build \
            ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyAware-BLE-debug-apk
          path: SpyAware-BLE/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpyAware-BLE/app/build/outputs/apk/debug/app-debug.apk
            SpyAware-Android-Analyzer/apk/SpyAware-Android-Analyzer-debug.apk
          generate_release_notes: true
